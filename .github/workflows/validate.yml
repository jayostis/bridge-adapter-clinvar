# No logic here on purpose: the checks live in cascade-bridge-spec and are
# published from it as an action. Why, and the pin rule: CLAUDE.md here.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: the adapter package against the specification it pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jayostis/cascade-bridge-spec/.github/actions/validate-adapter@v0.2.0
