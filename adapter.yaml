# yaml-language-server: $schema=schema/manifest/adapter.schema.json
#
# The Bridge-facing manifest of this adapter, in the shape section 6 of the
# Cascade Bridge RFC (the-cascade-protocol/spec#43) sketches. A Bridge reads
# this file first: what the source looks like, how to recognise it, what the
# Bridge must be able to run, and where the fixtures are.
#
# Phase 1: no mapping. `in`, `tables` and `vocab` appear in phase 2, once the
# files exist. `out` stays absent: ClinVar is import-only.

id: clinvar # cascade-cli's format id (src/lib/clinvar-converter/registry-entry.ts)
name: ClinVar VCV XML
version: 0.1.0
licence: Apache-2.0 # the package; NCBI's terms for the data are recorded per file in fixtures/ro-crate-metadata.json
bridge-spec: "the-cascade-protocol/spec#43 (draft)" # no numbered specification exists yet
tier: universal # no code; RFC section 9

vocabularies:
  # The same pin conformance/scripts/SPEC_PIN carries. The commit is on the
  # fork and not yet on the org; that file says why, and names the tags that
  # keep it reachable.
  pin:
    repo: jayostis/spec
    commit: e77ba5e8004bf57f34d42a1bee69d1cfb95f86e3
  versions:
    genomics: v1-draft # pre-stable; genomics.ttl at the pin carries owl:versionInfo "1.0-draft.0.6"
    core: "3.13"

source:
  media-type: application/xml
  schema: schema/ClinVar_VCV_2.6.xsd # pinned copy of NCBI's; docs/format.md says why 2.6
  envelopes:
    - id: efetch
      root: ClinVarResult-Set
      schema: schema/ClinVarResult-Set.xsd # NCBI's XSD does not declare this root; the wrapper adds it
      description: E-utilities efetch (db=clinvar, rettype=vcv). All five committed inputs.
    - id: release
      root: ClinVarVariationRelease
      description: The monthly and weekly release files, ClinVarVCVRelease_*.xml.gz. Declared by NCBI's XSD directly.
  unit: VariationArchive # a global element in the XSD, so each unit validates on its own

detect:
  root-element: [ClinVarResult-Set, ClinVarVariationRelease]
  contains: VariationArchive

profiles-required: [xslt-3]

# in:                # phase 2, one module per record class
#   xslt:
#     entry: in/xslt/clinvar.xsl
#     modules:
#       - in/xslt/variant.xsl
#       - in/xslt/interpretation.xsl
#       - in/xslt/submitter-assertion.xsl
#     findings: in/xslt/findings.xsl
# tables:            # phase 2: tables/review-status.csv, from cascade-cli's review-status-map.ts
# vocab:             # phase 2: vocab/clinvar-ext.ttl

fixtures: fixtures/cases.yaml
